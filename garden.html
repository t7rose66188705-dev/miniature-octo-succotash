<title>四季盆栽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: a season header (big season glyph + date/forecast + wallet), then a balcony grid of pot cards beside a shop / diary column */
:root {
  --bg: #edf0e8;
  --surface: #f9faf5;
  --surface-2: #e3e8dc;
  --ink: #26301f;
  --ink-soft: #66705c;
  --line: #d2d9c9;
  --water: #3f86c2;
  --nutr: #c38a22;
  --soil: #8b6646;
  --sun: #e0a21c;
  --heart: #cf4f66;
  --grow: #4f9a48;
  --warn: #c2462f;
  --indoor: #f1e6d4;
  --spring: #d2668f;
  --summer: #3b8f55;
  --autumn: #c9801f;
  --winter: #5f84ad;
  --accent: var(--spring);
  --font-display: "ZCOOL KuaiLe", "Noto Serif SC", "PingFang SC", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141913; --surface: #1d241b; --surface-2: #283126; --ink: #e9ecdf; --ink-soft: #a3ab96; --line: #313b2e;
    --water: #6eaee3; --nutr: #e2ad49; --soil: #b8916c; --sun: #f0c04e; --heart: #ee7d91; --grow: #7cc072; --warn: #f07a60; --indoor: #2c271f;
    --spring: #ee93b5; --summer: #6cc184; --autumn: #eaa649; --winter: #91b2d8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141913; --surface: #1d241b; --surface-2: #283126; --ink: #e9ecdf; --ink-soft: #a3ab96; --line: #313b2e;
  --water: #6eaee3; --nutr: #e2ad49; --soil: #b8916c; --sun: #f0c04e; --heart: #ee7d91; --grow: #7cc072; --warn: #f07a60; --indoor: #2c271f;
  --spring: #ee93b5; --summer: #6cc184; --autumn: #eaa649; --winter: #91b2d8; color-scheme: dark;
}
body[data-season="0"] { --accent: var(--spring); }
body[data-season="1"] { --accent: var(--summer); }
body[data-season="2"] { --accent: var(--autumn); }
body[data-season="3"] { --accent: var(--winter); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; transition: background .6s; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 18px; }

/* ---------- header ---------- */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 22px; align-items: center;
  padding: 16px 20px; border-radius: 18px; background: color-mix(in oklab, var(--accent) 13%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 25%, var(--line)); transition: background .6s, border-color .6s; }
.glyph { font-family: var(--font-display); font-size: 64px; line-height: 1; color: var(--accent); width: 72px; text-align: center; transition: color .6s; }
.when { display: grid; gap: 6px; min-width: 0; }
.when h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .06em; text-wrap: balance; }
.when h1 small { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; margin-left: 8px; }
.date { font-size: 15px; letter-spacing: .06em; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.wx { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.wx.alert { border-color: var(--warn); color: var(--warn); }
.side-ctl { display: grid; gap: 10px; justify-items: end; }
.wallet { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wallet small { font-size: 13px; font-weight: 400; color: var(--ink-soft); }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a0, #e0a92a 60%, #b07d12); box-shadow: inset 0 0 0 2px #c8921b; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.music { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; display: inline-flex; gap: 6px; align-items: center; }
.music:hover:not(:disabled) { border-color: var(--accent); }
.music:disabled { opacity: .5; cursor: default; }
.music svg { width: 16px; height: 16px; }
.next { border: 0; border-radius: 99px; padding: 8px 18px; background: var(--ink); color: var(--bg); font-weight: 600; letter-spacing: .06em; }
.next:hover { background: color-mix(in oklab, var(--ink) 85%, var(--accent)); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.sec-head .meta { color: var(--ink-soft); font-size: 13px; }
.sec-head .push { margin-left: auto; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.ghost:hover:not(:disabled) { border-color: var(--accent); }
.ghost:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- balcony ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.card.target { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 40%, transparent); }
.cv-wrap { position: relative; background: linear-gradient(to bottom, color-mix(in oklab, var(--accent) 9%, var(--surface)), var(--surface) 72%); }
.cv-wrap.in { background: linear-gradient(to bottom, var(--indoor), var(--surface) 80%); }
.cv-wrap canvas { display: block; width: 100%; aspect-ratio: 200 / 220; max-width: 100%; touch-action: manipulation; cursor: pointer; }
.chip { position: absolute; top: 10px; left: 10px; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); letter-spacing: .06em; }
.chip.ripe { background: var(--accent); color: var(--surface); border-color: transparent; }
.chip.dead { background: var(--surface-2); color: var(--ink-soft); }
.age { position: absolute; top: 11px; right: 12px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.where { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--ink-soft); letter-spacing: .08em; }
.info { padding: 10px 12px 12px; display: grid; gap: 8px; align-content: start; }
.name-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name-row h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .06em; }
.name-row span { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2.9em; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.bar b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.track { position: relative; height: 7px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width .4s; }
.track .band { position: absolute; top: 0; bottom: 0; border-left: 1px dashed color-mix(in oklab, var(--ink) 40%, transparent); border-right: 1px dashed color-mix(in oklab, var(--ink) 40%, transparent); }
.bar.water i { background: var(--water); } .bar.nutr i { background: var(--nutr); } .bar.soil i { background: var(--soil); }
.bar.light i { background: var(--sun); } .bar.heart i { background: var(--heart); } .bar.grow i { background: var(--grow); }
.bar.over b { color: var(--warn); }
.status { margin: 0; font-size: 13px; min-height: 1.55em; }
.status.bad { color: var(--warn); }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.act { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 12px; line-height: 1.35; }
.act svg { width: 18px; height: 18px; }
.act:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.act:disabled { opacity: .42; cursor: default; }
.act .cost { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.wide { border: 0; border-radius: 10px; padding: 8px; font-weight: 600; letter-spacing: .06em; background: var(--accent); color: var(--surface); }
.wide.soft { background: var(--surface-2); color: var(--ink); font-weight: 400; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.empty { border-style: dashed; background: transparent; }
.empty .slot-body { padding: 26px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--ink-soft); min-height: 220px; align-content: center; }
.empty .slot-body strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); letter-spacing: .08em; }

/* ---------- shop ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.side { display: grid; gap: 18px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shop-hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
.items { display: grid; gap: 8px; max-height: 680px; overflow-y: auto; padding-right: 2px; }
.item { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); align-items: center; }
.item canvas { width: 74px; height: 81px; display: block; border-radius: 8px; background: color-mix(in oklab, var(--accent) 6%, var(--surface)); }
.item .tx { display: grid; gap: 2px; min-width: 0; }
.item .t1 { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.item .t1 strong { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: .05em; margin-right: 2px; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-soft); }
.tag.got { border-color: var(--grow); color: var(--grow); }
.item p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.item .t3 { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.item .t3 span { font-size: 12px; font-variant-numeric: tabular-nums; }
.buy { margin-left: auto; border: 0; border-radius: 99px; padding: 3px 14px; background: var(--accent); color: var(--surface); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.buy:disabled { background: var(--surface-2); color: var(--ink-soft); cursor: not-allowed; }

/* ---------- diary ---------- */
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font-size: 13px; }
.log li { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 8px; }
.log li span { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--ink-soft); font-size: 12px; align-items: center; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; transition: opacity .3s, transform .3s; z-index: 10; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .items { max-height: none; }
}
@media (max-width: 560px) {
  .top { grid-template-columns: auto minmax(0, 1fr); padding: 14px; }
  .glyph { font-size: 48px; width: 52px; }
  .side-ctl { grid-column: 1 / -1; justify-items: stretch; }
  .wallet { justify-content: flex-start; }
  .ctl-row { justify-content: space-between; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .info { padding: 8px 8px 10px; }
  .name-row h3 { font-size: 17px; }
  .name-row span { margin-left: 0; }
  .bar { grid-template-columns: 2.4em minmax(0, 1fr) 2.6em; gap: 4px; }
  .acts { gap: 4px; }
  .act { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="glyph" id="glyph" aria-hidden="true">春</div>
    <div class="when">
      <h1>四季盆栽<small>清清的阳台</small></h1>
      <div class="date"><span id="date">第1年 · 春 · 第1天</span><span class="wx" id="wx">今天 晴 16°C</span><span class="wx" id="fc">明天 晴</span></div>
    </div>
    <div class="side-ctl">
      <div class="wallet"><span class="coin" aria-hidden="true"></span><span id="gold">500</span><small>金币</small></div>
      <div class="ctl-row">
        <button class="music" id="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span id="musiclbl">放首歌</span></button>
        <button class="next" id="next">睡一觉 · 下一天</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="sec-head">
        <h2>阳台</h2><span class="meta" id="slotinfo"></span>
        <button class="ghost push" id="expand">扩建阳台</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="side">
      <section class="panel" id="shop">
        <div class="sec-head"><h2>花市</h2><span class="meta" id="dexinfo"></span></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="pots" aria-selected="true">花盆</button>
          <button role="tab" data-tab="flower" aria-selected="false">花卉</button>
          <button role="tab" data-tab="grass" aria-selected="false">绿植·草</button>
          <button role="tab" data-tab="succ" aria-selected="false">多肉</button>
          <button role="tab" data-tab="tree" aria-selected="false">树木</button>
        </div>
        <p class="shop-hint" id="shophint"></p>
        <div class="items" id="items"></div>
      </section>
      <section class="panel">
        <div class="sec-head"><h2>园艺日记</h2></div>
        <ol class="log" id="log"></ol>
      </section>
      <div class="foot"><span>进度自动保存在这台设备上</span><button class="ghost" id="reset">重新开始</button></div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {

const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ================= data ================= */
const SEASONS = ['春', '夏', '秋', '冬'];

const NEED = {

const WATER_ADD = 35, DRAIN = 40, FERT_ADD = 30, SOIL_ADD = 40, FERT_COST = 8, NUTR_DECAY = 4;

const POTS = {

// colors are [h, s, l]
const PLANTS = [
  // ---- 花卉 ----

  { id: 'hydrangea', name: '绣球花', cat: 'flower', form: 'ball', fl: 'ball', color: [222, 60, 68], leaf: [110, 40, 35], price: 110, sell: 300, days: 18, need: 'high', light: 'half', grow: [0, 1], bloom: [1], hardy: true, note: '花色随土壤酸碱变化，是个喝水大胃王，怕暴晒。' },
  { id: 'lavender', name: '薰衣草', cat: 'flower', form: 'spike', fl: 'lav', color: [265, 45, 62], leaf: [100, 14, 52], price: 75, sell: 210, days: 15, need: 'low', light: 'sun', grow: [0, 1], bloom: [1], hardy: true, note: '怕涝不怕旱，浇水宁少勿多。' },
  { id: 'hyacinth', name: '风信子', cat: 'flower', form: 'single', fl: 'hya', color: [310, 50, 58], leaf: [125, 35, 38], price: 55, sell: 150, days: 11, need: 'mid', light: 'half', grow: [0, 3], bloom: [0], hardy: true, note: '早春的球根花，一串小铃铛，香气很浓。' },
  // ---- 绿植·草 ----

}
function sellPrice(slot) {
  const pl = slot.plant, sp = SP[pl.sp], s = seasonOf(state.day);
  let p = sp.sell * (0.6 + 0.4 * pl.health / 100) * POTS[slot.type].sell;
  if (isBlooming(pl, sp, s)) p *= 1.25;
  if (isFruiting(pl, sp, s)) p *= 1.2;

}
function stageName(pl, sp) {

  if (pl.matured) {
    if (isFruiting(pl, sp, s)) return '结果了';
    if (isBlooming(pl, sp, s)) return sp.cat === 'tree' ? '满树花开' : '开花了';
    return sp.cat === 'tree' ? '成树' : '成株';
  }
  if (pl.progress < 30) return '幼苗';

}

  if (pl.water > 100) return ['盆里积水了！倒掉积水，或者搬进屋避雨。', true];
  if (pl.water < 10) return ['土干透了，叶子都蔫了，快浇水！', true];

function addLog(t) { state.log.unshift({ d: state.day, t }); state.log.length = Math.min(state.log.length, 40); }

  if (idx < 0) return toast('阳台放满了，先扩建一下吧。');

  state.gold -= p.price;
  state.pots[idx] = { type, indoor: false, used: false, plant: null };
  state.target = idx;
  addLog(`买了一个${p.name}，摆在阳台第 ${idx + 1} 格。`);
  addFx(idx, 'spark');

}
function sellPot(i) {
  const slot = state.pots[i]; if (!slot || slot.plant) return;
  const r = potRefund(slot);
  state.gold += r; state.pots[i] = null;
  if (state.target === i) state.target = -1;
  addLog(`${slot.used ? '把用过的' : '把没用过的'}${POTS[slot.type].name}卖了，拿回 ${r} 金币。`);

    pl.water = Math.max(0, pl.water - DRAIN);

function nextDay() {
  const season = seasonOf(state.day);
  const notes = [];
  state.pots.forEach((slot) => {
    if (!slot || !slot.plant || slot.plant.dead) return;
    const pl = slot.plant, sp = SP[pl.sp], pot = POTS[slot.type], need = NEED[sp.need];
    const [lo, hi] = need.range, [llo, lhi] = LIGHT[sp.light].range;
    const sleep = dormant(sp, season), L = slotLight(slot);
    // judge the day with today's care
    const wq = pl.water > 100 ? 0.2 : pl.water < 10 ? 0 : (pl.water >= lo && pl.water <= hi) ? 1 : 0.55;
    const nq = pl.nutr > 100 ? 0.4 : pl.nutr >= 30 ? 1 : pl.nutr >= 12 ? 0.6 : 0.3;
    const sq = pl.soil >= 40 ? 1 : pl.soil >= 20 ? 0.7 : 0.4;
    const lq = sleep || (L >= llo && L <= lhi) ? 1 : (L >= llo - 20 && L <= lhi + 15) ? 0.6 : 0.3;
    const q = wq * 0.35 + nq * 0.2 + sq * 0.2 + lq * 0.25;
    let dh = 0;
    if (pl.water > 100) dh -= 6 + (pl.water - 100) * 0.4;
    else if (pl.water < 10) dh -= 14;
    else if ((sp.need === 'low' || sp.need === 'xlow') && pl.water > hi + 10) dh -= 5;
    else if (sp.need === 'high' && pl.water < lo - 15) dh -= 4;
    if (pl.nutr > 100) dh -= 10; else if (pl.nutr < 10) dh -= 4;
    if (pl.soil < 15) dh -= 3;
    if (L > lhi + 15) dh -= 5;
    pl.darkDays = !sleep && L < llo - 20 ? (pl.darkDays || 0) + 1 : 0;
    if (pl.darkDays >= 3) dh -= 4;
    if (dh === 0 && q >= 0.75) dh = 6;
    pl.health = clamp(pl.health + dh, 0, 100);
    if (pl.health <= 0) { pl.dead = true; notes.push(`${sp.name}没能撑过去，枯萎了。`); return; }
    if (!pl.matured) {
      const sf = sp.grow.includes(season) ? 1.15 : season === 3 ? 0.4 : 0.85;
      const g = q * sf * pot.grow * (0.5 + 0.5 * pl.health / 100) * 100 / sp.days;
      pl.progress = Math.min(100, pl.progress + g);
      if (pl.progress >= 100) {
        pl.matured = true;
        const first = !state.dex[sp.id];
        state.dex[sp.id] = true;
        notes.push(`${sp.name}长大了！${first ? '图鉴新解锁。' : ''}`);
      }

    pl.age++;
    const hot = (!slot.indoor && state.weather === '高温') ? 1.5 : 1;
    pl.water = Math.max(0, pl.water - 22 * need.mul * SEASON_DRY[season] * pot.dry * hot * (slot.indoor ? 0.8 : 1));
    pl.nutr = Math.max(0, pl.nutr - NUTR_DECAY);
    pl.soil = Math.max(0, pl.soil - 9 * pot.compact);
    pl.done = {};
  });
  state.day++;
  const ns = seasonOf(state.day);
  if (ns !== season) { notes.unshift(SEASON_TIPS[ns]); if (ns === 0) notes.unshift(`新的一年，第 ${yearOf(state.day)} 年开始了。`); }
  state.weather = state.forecast; state.temp = state.ftemp;
  state.forecast = rollWeather(seasonOf(state.day + 1));
  state.ftemp = rollTemp(seasonOf(state.day + 1), state.forecast);
  const outside = state.pots.filter(s => s && s.plant && !s.plant.dead && !s.indoor);
  if (state.weather === '小雨' || state.weather === '雷阵雨') {
    const add = state.weather === '小雨' ? 28 : 38, what = state.weather === '小雨' ? '下了场小雨' : '一场雷阵雨';
    outside.forEach(s => s.plant.water = Math.min(130, s.plant.water + add));
    const soaked = outside.filter(s => s.plant.water > 100).map(s => SP[s.plant.sp].name);
    if (soaked.length) notes.push(`${what}，${[...new Set(soaked)].join('、')}的盆里积水了。可以倒掉积水，或者搬进屋。`);
    else if (outside.length) notes.push(`${what}，阳台上的盆土都喝饱了水。`);
  } else if (state.weather === '雪') {
    outside.forEach(s => s.plant.water = Math.min(130, s.plant.water + 8));
  } else if (state.weather === '霜冻') {
    const hurt = [];
    outside.forEach(s => { if (!SP[s.plant.sp].hardy) { s.plant.health = Math.max(1, s.plant.health - 10); hurt.push(SP[s.plant.sp].name); } });
    if (hurt.length) notes.push(`夜里打霜，阳台上的${[...new Set(hurt)].join('、')}冻着了。`);
  } else if (state.weather === '高温' && outside.length) {
    notes.push('今天高温，阳台上的水干得特别快。');
  }
  notes.forEach(addLog);
  commit();
  const head = `${dayLabel(state.day)} · ${state.weather} ${state.temp}°C`;
  toast(notes.length ? `${head} — ${notes[0]}` : `${head} — 新的一天。`);
}

      for (let k = 0; k < 5; k++) { c.fillStyle = leafCol(leafC, v, 0); ell(c, x + (k - 2) * rx * 0.36, y + Math.abs(k - 2) * 0.6, rx * 0.34, ry * 0.85); }
      c.fillStyle = leafCol(leafC, v, 9); ell(c, x - rx * 0.2, y - ry * 0.45, rx * 0.55, ry * 0.4);
      c.strokeStyle = leafCol(leafC, v, 12); c.lineWidth = 0.7;

function sapling(c, pl, sp, S, v, sw, season) {
  const h = 16 + (S - 0.22) * 150, x1 = BX + sw * 1.2, y1 = BY - h;
  curve(c, v.dead ? 'hsl(30,15%,32%)' : hsl(sp.bark, 12), 1.6 + S * 2.4, BX, BY, BX - 3, BY - h * 0.5, x1, y1);
  const leafC = v.dead ? [30, 26, 34] : sp.leaves[season];
  if (!leafC) {
    c.fillStyle = hsl(sp.bark, 18);
    for (let k = 1; k <= 3; k++) { const [x, y] = qpt(BX, BY, BX - 3, BY - h * 0.5, x1, y1, k / 3.3); dot(c, x + (k % 2 ? 1.5 : -1.5), y, 1.3); }
    if (season === 3) { c.fillStyle = 'rgba(250,252,255,.9)'; ell(c, x1, y1 - 1, 2.5, 1.2); }
    return;
  }
  const n = 4 + Math.round((S - 0.22) * 20);
  for (let i = 0; i < n; i++) {
    const t = 0.35 + i / n * 0.6, [x, y] = qpt(BX, BY, BX - 3, BY - h * 0.5, x1, y1, t), side = i % 2 ? 1 : -1;

}

function visOf(pl, sp) {
  const [lo] = NEED[sp.need].range;
  let y = (1 - pl.health / 100) * 0.8;
  if (pl.nutr < 15) y += 0.35;
  if (pl.water > 100) y += 0.25;
  if ((pl.darkDays || 0) >= 3) y += 0.2;
  let droop = pl.water < Math.min(15, lo) ? 0.25 + (15 - pl.water) / 15 * 0.65 : pl.water < lo - 12 ? 0.15 : 0;
  if (pl.dead) { y = 1; droop = 1; }
  return { y: Math.min(1, y), droop: clamp(droop, 0, 1), dead: pl.dead };
}

function drawPlant(c, pl, sp, season, now, wig = 0) {
  const S = 0.22 + 0.78 * clamp(pl.progress / 100, 0, 1);
  const v = visOf(pl, sp);
  const amp = reduce ? 0 : (v.dead ? 0.2 : 1);
  const sw = Math.sin(now / 900 + pl.id * 1.7) * amp + wig;
  const R = rng(pl.id * 9973 + 17);
  c.save();
  FORMS[sp.form](c, pl, sp, S, v, sw, season, R, now);
  c.restore();
}

function heart(c, x, y, s) { c.beginPath(); c.moveTo(x, y + s * 0.35); c.bezierCurveTo(x - s, y - s * 0.3, x - s * 0.45, y - s, x, y - s * 0.4); c.bezierCurveTo(x + s * 0.45, y - s, x + s, y - s * 0.3, x, y + s * 0.35); c.fill(); }
function drawFx(c, list, now) {
  list.forEach(f => {
    const e = now - f.t0;
    if (f.type === 'water') {
      for (let k = 0; k < 12; k++) {

        c.fillStyle = `rgba(80,150,220,${0.85 * (1 - p * 0.4)})`;
        c.beginPath(); c.moveTo(x, y - 5); c.quadraticCurveTo(x + 3, y, x, y + 2); c.quadraticCurveTo(x - 3, y, x, y - 5); c.fill();
      }
    } else if (f.type === 'drain') {
      for (let k = 0; k < 12; k++) {
        const p = e / 900 - k * 0.04; if (p < 0 || p > 1) continue;
        c.fillStyle = `rgba(80,150,220,${0.8 * (1 - p)})`; dot(c, 152 + p * 22 + (k % 3) * 2, 162 + p * p * 50 + (k % 4), 1.6);
      }
    } else if (f.type === 'fert') {

        const p = e / 800 - k * 0.03; if (p < 0 || p > 1) continue;
        c.fillStyle = k % 3 ? 'rgba(214,160,50,.95)' : 'rgba(255,240,180,.95)';
        dot(c, 70 + (k * 23) % 60, 50 + p * 108, 1.6);

    } else if (f.type === 'soil') {

    } else if (f.type === 'heart') {

        c.fillStyle = `rgba(226,92,120,${1 - p})`; heart(c, 78 + k * 9 + Math.sin(p * 6 + k) * 4, 120 - p * 80, 5 + (k % 2) * 2);
      }

        const p = e / 2200 - k * 0.12; if (p < 0 || p > 1) continue;
        c.fillStyle = `rgba(110,90,170,${1 - p})`; c.fillText(k % 2 ? '♪' : '♫', 60 + k * 20 + Math.sin(p * 8 + k) * 6, 130 - p * 100);
      }
    } else if (f.type === 'move') {

    } else if (f.type === 'spark' || f.type === 'coins') {

        const a = k / 10 * TAU, d = 20 + p * 46, x = 100 + Math.cos(a) * d, y = (f.type === 'coins' ? 120 - p * 60 : 110) + Math.sin(a) * d * 0.6;
        c.fillStyle = f.type === 'coins' ? `rgba(230,175,40,${1 - p})` : `rgba(255,210,90,${1 - p})`;
        if (f.type === 'coins') dot(c, x, y, 3); else { c.save(); c.translate(x, y); c.rotate(p * 3); c.fillRect(-1.5, -1.5, 3, 3); c.restore(); }
      }

}

function drawWeather(c, wx, now, seed) {
  if (wx === '晴' || wx === '高温') {
    const g = c.createRadialGradient(178, 18, 2, 178, 18, 60);
    g.addColorStop(0, wx === '高温' ? 'rgba(255,190,90,.35)' : 'rgba(255,220,130,.25)'); g.addColorStop(1, 'rgba(255,220,130,0)');
    c.fillStyle = g; c.fillRect(110, 0, 90, 80);
    return;
  }
  if (reduce) return;
  if (wx === '小雨' || wx === '雷阵雨') {
    c.strokeStyle = 'rgba(110,150,200,.45)'; c.lineWidth = 0.9;
    const n = wx === '小雨' ? 12 : 20, sp = wx === '小雨' ? 0.14 : 0.22;
    for (let k = 0; k < n; k++) { const x = (k * 53 + seed * 31) % 210, y = ((now * sp) + k * 97 + seed * 13) % 240 - 20; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y + 10); c.stroke(); }
  } else if (wx === '雪') {

function barHTML(cls, label, val, max, band, shown) {

const ALERT_WX = ['小雨', '雷阵雨', '高温', '霜冻', '雪'];

  const hint = $('shophint');
  if (state.tab === 'pots') {
    hint.textContent = freeSlot ? '花盆会摆在阳台的第一个空位上。买多了也没关系，空花盆可以卖回来（没用过的原价退）。' : '阳台放满了，扩建之后才能再买花盆。';
    Object.entries(POTS).forEach(([k, p]) => {
      const el = document.createElement('div'); el.className = 'item';
      const cv = document.createElement('canvas'); cv.width = 148; cv.height = 162;
      el.innerHTML = `<div class="tx"><div class="t1"><strong>${p.name}</strong></div><p>${p.desc}</p>
        <div class="t3"><button class="buy" data-buypot="${k}" ${!freeSlot || state.gold < p.price ? 'disabled' : ''}>${p.price} 金</button></div></div>`;
      el.prepend(cv); items.append(el);
      const c = cv.getContext('2d'); c.setTransform(148 / 200, 0, 0, 148 / 200, 0, -30); drawPot(c, k); drawSoil(c, { type: k }, null, '');
    });
    return;
  }
  hint.textContent = potIdx >= 0 ? `买下的幼苗会种进阳台第 ${potIdx + 1} 格的空花盆。` : '还没有空花盆，先去“花盆”那一栏买一个。';
  PLANTS.filter(p => p.cat === state.tab).forEach(sp => {
    const el = document.createElement('div'); el.className = 'item';
    const cv = document.createElement('canvas'); cv.width = 148; cv.height = 162;
    el.innerHTML = `<div class="tx"><div class="t1"><strong>${sp.name}</strong><span class="tag">${NEED[sp.need].label}</span><span class="tag">${LIGHT[sp.light].label}</span>${state.dex[sp.id] ? '<span class="tag got">已养成</span>' : ''}</div>
      <p>${sp.note}</p>
      <div class="t3"><span>约 ${sp.days} 天长成 · 卖 ${sp.sell} 金起</span><button class="buy" data-buyplant="${sp.id}" ${potIdx < 0 || state.gold < sp.price ? 'disabled' : ''}>${sp.price} 金</button></div></div>`;
    el.prepend(cv); items.append(el);
    const season = sp.show ?? (sp.bloom ? sp.bloom[0] : sp.id === 'foxtail' ? 2 : 1);
    const demo = { sp: sp.id, id: PLANTS.indexOf(sp) + 3, progress: 100, health: 100, water: 60, nutr: 60, soil: 70, matured: true, dead: false };
    const c = cv.getContext('2d'); c.setTransform(148 / 200, 0, 0, 148 / 200, 0, 0);
    drawPot(c, 'clay'); drawSoil(c, { type: 'clay' }, demo, ''); drawPlant(c, demo, sp, season, 0);
  });
}

/* ================= loop ================= */
function frame(now) {
  const season = seasonOf(state.day);
  for (let i = 0; i < state.pots.length; i++) {
    const slot = state.pots[i], cv = canvases[i];
    if (!slot || !cv || !cv.isConnected || !cv.width) continue;
    const c = cv.getContext('2d'), k = cv.width / 200;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(k, 0, 0, k, 0, 0);
    if (slot.indoor) drawWindow(c); else drawWeather(c, state.weather, now, i + 1);
    drawPot(c, slot.type);
    drawSoil(c, slot, slot.plant, state.weather);
    if (slot.plant) {
      const we = now - (wiggles[i] || -1e9), wig = we < 1200 ? Math.sin(we / 70) * 3 * (1 - we / 1200) : 0;
      drawPlant(c, slot.plant, SP[slot.plant.sp], season, now, wig);
    }
    drawFx(c, fx.filter(f => f.i === i), now);
  }
  for (let j = fx.length - 1; j >= 0; j--) if (now - fx[j].t0 > 3000) fx.splice(j, 1);
  requestAnimationFrame(frame);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act) act(+b.dataset.i, b.dataset.act);
  else if (b.dataset.sell) sell(+b.dataset.sell);
  else if (b.dataset.sellpot) sellPot(+b.dataset.sellpot);
  else if (b.dataset.clear) clearPlant(+b.dataset.clear);
  else if (b.dataset.buypot) buyPot(b.dataset.buypot);
  else if (b.dataset.buyplant) buyPlant(b.dataset.buyplant);
  else if (b.dataset.plant) { state.target = +b.dataset.plant; if (state.tab === 'pots') state.tab = 'flower'; render(); $('shop').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  else if (b.dataset.go) { state.tab = b.dataset.go; render(); $('shop').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  else if (b.dataset.tab) { state.tab = b.dataset.tab; render(); }
});
$('next').addEventListener('click', nextDay);
$('music').addEventListener('click', music);
$('expand').addEventListener('click', expand);
let resetArmed = 0;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (Date.now() - resetArmed < 3000) { state = freshState(); canvases.length = 0; shopKey = ''; b.textContent = '重新开始'; resetArmed = 0; commit(); toast('阳台清空了，500 金币重新出发。'); return; }
  resetArmed = Date.now(); b.textContent = '再点一次确认清空';
  setTimeout(() => { if (Date.now() - resetArmed >= 3000) b.textContent = '重新开始'; }, 3100);
});
new ResizeObserver(() => canvases.forEach(cv => cv && cv.isConnected && sizeCanvas(cv))).observe($('grid'));

function start(data) {
  state = migrate(data && typeof data.day === 'number' ? data : null) || load() || freshState();
  render();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
