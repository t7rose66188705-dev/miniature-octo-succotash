<title>四季盆栽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: a season header (big season glyph + clock + wallet), then a balcony grid of pot cards beside a shop / diary column */
:root {
  --bg: #edf0e8;
  --surface: #f9faf5;
  --surface-2: #e3e8dc;
  --ink: #26301f;
  --ink-soft: #66705c;
  --line: #d2d9c9;
  --water: #3f86c2;
  --nutr: #c38a22;
  --soil: #8b6646;
  --heart: #cf4f66;
  --grow: #4f9a48;
  --warn: #c2462f;
  --spring: #d2668f;
  --summer: #3b8f55;
  --autumn: #c9801f;
  --winter: #5f84ad;
  --accent: var(--spring);
  --font-display: "ZCOOL KuaiLe", "Noto Serif SC", "PingFang SC", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141913; --surface: #1d241b; --surface-2: #283126; --ink: #e9ecdf; --ink-soft: #a3ab96; --line: #313b2e;
    --water: #6eaee3; --nutr: #e2ad49; --soil: #b8916c; --heart: #ee7d91; --grow: #7cc072; --warn: #f07a60;
    --spring: #ee93b5; --summer: #6cc184; --autumn: #eaa649; --winter: #91b2d8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141913; --surface: #1d241b; --surface-2: #283126; --ink: #e9ecdf; --ink-soft: #a3ab96; --line: #313b2e;
  --water: #6eaee3; --nutr: #e2ad49; --soil: #b8916c; --heart: #ee7d91; --grow: #7cc072; --warn: #f07a60;
  --spring: #ee93b5; --summer: #6cc184; --autumn: #eaa649; --winter: #91b2d8; color-scheme: dark;
}
body[data-season="0"] { --accent: var(--spring); }
body[data-season="1"] { --accent: var(--summer); }
body[data-season="2"] { --accent: var(--autumn); }
body[data-season="3"] { --accent: var(--winter); }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; transition: background .6s; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 18px; }

/* ---------- header ---------- */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 22px; align-items: center;
  padding: 16px 20px; border-radius: 18px; background: color-mix(in oklab, var(--accent) 13%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 25%, var(--line)); transition: background .6s, border-color .6s; }
.glyph { font-family: var(--font-display); font-size: 64px; line-height: 1; color: var(--accent); width: 72px; text-align: center; transition: color .6s; }
.when { display: grid; gap: 4px; min-width: 0; }
.when h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .06em; text-wrap: balance; }
.when h1 small { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; margin-left: 8px; }
.date { font-size: 15px; letter-spacing: .08em; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.wx { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.daybar { height: 4px; border-radius: 4px; background: color-mix(in oklab, var(--accent) 18%, var(--surface)); overflow: hidden; max-width: 340px; }
.daybar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.side-ctl { display: grid; gap: 10px; justify-items: end; }
.wallet { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a0, #e0a92a 60%, #b07d12); box-shadow: inset 0 0 0 2px #c8921b; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13px; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.next { border: 0; border-radius: 99px; padding: 8px 18px; background: var(--ink); color: var(--bg); font-weight: 600; letter-spacing: .06em; }
.next:hover { background: color-mix(in oklab, var(--ink) 85%, var(--accent)); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.sec-head .meta { color: var(--ink-soft); font-size: 13px; }
.sec-head .push { margin-left: auto; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.ghost:hover:not(:disabled) { border-color: var(--accent); }
.ghost:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- balcony ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.card.target { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 40%, transparent); }
.cv-wrap { position: relative; background: linear-gradient(to bottom, color-mix(in oklab, var(--accent) 7%, var(--surface)), var(--surface) 70%); }
.cv-wrap canvas { display: block; width: 100%; aspect-ratio: 200 / 220; max-width: 100%; touch-action: manipulation; }
.chip { position: absolute; top: 10px; left: 10px; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); letter-spacing: .06em; }
.chip.ripe { background: var(--accent); color: var(--surface); border-color: transparent; }
.chip.dead { background: var(--surface-2); color: var(--ink-soft); }
.age { position: absolute; top: 11px; right: 12px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.info { padding: 10px 12px 12px; display: grid; gap: 8px; align-content: start; }
.name-row { display: flex; align-items: baseline; gap: 8px; }
.name-row h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .06em; }
.name-row span { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2.9em; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.bar b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.track { position: relative; height: 7px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width .4s; }
.track .band { position: absolute; top: 0; bottom: 0; border-left: 1px dashed color-mix(in oklab, var(--ink) 35%, transparent); border-right: 1px dashed color-mix(in oklab, var(--ink) 35%, transparent); }
.bar.water i { background: var(--water); } .bar.nutr i { background: var(--nutr); } .bar.soil i { background: var(--soil); }
.bar.heart i { background: var(--heart); } .bar.grow i { background: var(--grow); }
.bar.over b { color: var(--warn); }
.status { margin: 0; font-size: 13px; min-height: 1.55em; }
.status.bad { color: var(--warn); }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.act { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 12px; }
.act svg { width: 18px; height: 18px; }
.act:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.act:disabled { opacity: .45; cursor: default; }
.act.done { opacity: .55; }
.act .cost { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.wide { border: 0; border-radius: 10px; padding: 8px; font-weight: 600; letter-spacing: .06em; background: var(--accent); color: var(--surface); }
.wide.soft { background: var(--surface-2); color: var(--ink); }
.empty { border-style: dashed; background: transparent; }
.empty .slot-body { padding: 26px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--ink-soft); min-height: 220px; align-content: center; }
.empty .slot-body strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--ink); letter-spacing: .08em; }

/* ---------- shop ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.side { display: grid; gap: 18px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 13px; font-size: 13px; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shop-hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
.items { display: grid; gap: 8px; max-height: 640px; overflow-y: auto; padding-right: 2px; }
.item { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); align-items: center; }
.item canvas { width: 74px; height: 81px; display: block; border-radius: 8px; background: color-mix(in oklab, var(--accent) 6%, var(--surface)); }
.item .tx { display: grid; gap: 2px; min-width: 0; }
.item .t1 { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.item .t1 strong { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: .05em; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-soft); }
.tag.got { border-color: var(--grow); color: var(--grow); }
.item p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.item .t3 { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.item .t3 span { font-size: 12px; font-variant-numeric: tabular-nums; }
.buy { margin-left: auto; border: 0; border-radius: 99px; padding: 3px 14px; background: var(--accent); color: var(--surface); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.buy:disabled { background: var(--surface-2); color: var(--ink-soft); cursor: not-allowed; }

/* ---------- diary ---------- */
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font-size: 13px; }
.log li { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 8px; }
.log li span { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--ink-soft); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; transition: opacity .3s, transform .3s; z-index: 10; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .items { max-height: none; }
}
@media (max-width: 560px) {
  .top { grid-template-columns: auto minmax(0, 1fr); padding: 14px; }
  .glyph { font-size: 48px; width: 52px; }
  .side-ctl { grid-column: 1 / -1; justify-items: stretch; }
  .wallet { justify-content: flex-start; }
  .ctl-row { justify-content: space-between; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .info { padding: 8px 9px 10px; }
  .name-row h3 { font-size: 17px; }
  .act { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="glyph" id="glyph" aria-hidden="true">春</div>
    <div class="when">
      <h1>四季盆栽<small>清清的阳台</small></h1>
      <div class="date"><span id="date">第1年 · 春 · 第1天</span><span class="wx" id="wx">晴 16°C</span><span id="hour"></span></div>
      <div class="daybar" id="daybar" hidden><i id="dayfill"></i></div>
    </div>
    <div class="side-ctl">
      <div class="wallet"><span class="coin" aria-hidden="true"></span><span id="gold">500</span><span style="font-size:13px;font-weight:400;color:var(--ink-soft)">金币</span></div>
      <div class="ctl-row">
        <div class="seg" role="group" aria-label="时间流速">
          <button data-speed="0" aria-pressed="true">手动</button>
          <button data-speed="1" aria-pressed="false">慢</button>
          <button data-speed="2" aria-pressed="false">快</button>
        </div>
        <button class="next" id="next">睡一觉 · 下一天</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section>
      <div class="sec-head">
        <h2>阳台</h2><span class="meta" id="slotinfo"></span>
        <button class="ghost push" id="expand">扩建阳台</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="side">
      <section class="panel" id="shop">
        <div class="sec-head"><h2>花市</h2><span class="meta" id="dexinfo"></span></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="pots" aria-selected="true">花盆</button>
          <button role="tab" data-tab="flower" aria-selected="false">花卉</button>
          <button role="tab" data-tab="grass" aria-selected="false">绿植·草</button>
          <button role="tab" data-tab="tree" aria-selected="false">树木</button>
        </div>
        <p class="shop-hint" id="shophint"></p>
        <div class="items" id="items"></div>
      </section>
      <section class="panel">
        <div class="sec-head"><h2>园艺日记</h2></div>
        <ol class="log" id="log"></ol>
      </section>
      <div class="foot"><span>进度自动保存在这台设备上</span><button class="ghost" id="reset">重新开始</button></div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const SP = Object.fromEntries(PLANTS.map(p => [p.id, p]));

/* ================= state ================= */
const SAVE_KEY = 'siji-penzai-v1';

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

const seasonOf = d => Math.floor(d / DAYS_PER_SEASON) % 4;

function isBlooming(pl, sp, season) {
  if (pl.dead || !pl.matured) return false;
  if (sp.cat === 'tree') return !!(sp.blossom && sp.blossom.seasons.includes(season));
  return !!(sp.bloom && sp.bloom.includes(season));
}
function isFruiting(pl, sp, season) {
  return !pl.dead && pl.matured && !!(sp.fruit && sp.fruit.seasons.includes(season));
}
function sellPrice(slot) {
  const pl = slot.plant, sp = SP[pl.sp], s = seasonOf(state.day);
  let p = sp.sell * (0.6 + 0.4 * pl.health / 100) * POTS[slot.type].sell;
  if (isBlooming(pl, sp, s)) p *= 1.25;
  if (isFruiting(pl, sp, s)) p *= 1.2;
  return Math.round(p);
}
function stageName(pl, sp) {
  if (pl.dead) return '枯萎';
  const s = seasonOf(state.day);
  if (pl.matured) {
    if (isFruiting(pl, sp, s)) return '结果了';
    if (isBlooming(pl, sp, s)) return sp.cat === 'tree' ? '满树花开' : '开花了';
    return sp.cat === 'tree' ? '成树' : '成株';
  }
  if (pl.progress < 30) return '幼苗';
  if (pl.progress < 70) return '生长期';
  return sp.cat === 'tree' ? '小树' : (sp.bloom ? '花苞期' : '快长大了');
}
function statusOf(pl, sp) {
  const [lo, hi] = NEED[sp.need].range;
  if (pl.dead) return ['枯萎了……把它铲掉，花盆还能再用。', true];
  if (pl.water > 100) return ['盆里积水了，根会闷坏的！', true];
  if (pl.water < 10) return ['土干透了，叶子都蔫了，快浇水！', true];
  if (pl.nutr > 100) return ['肥下多了，有点烧根。', true];
  if (pl.health < 35) return ['看起来很虚弱，要好好照顾。', true];
  if (pl.water < lo) return ['有点渴了。', false];
  if (pl.nutr < 15) return ['叶子发黄，缺肥了。', false];
  if (pl.soil < 20) return ['土壤板结了，松松土吧。', false];
  if (pl.water > hi) return ['土还湿着，今天先别浇。', false];
  const s = seasonOf(state.day);
  if (pl.matured) return [isBlooming(pl, sp, s) ? '正是最好看的时候，卖价更高。' : '已经长大了，可以拿去卖。', false];
  if (s === 3 && !sp.grow.includes(3)) return ['冬天长得慢，耐心一点。', false];

}

/* ================= actions ================= */
function addLog(t) { state.log.unshift({ d: state.day, t }); state.log.length = Math.min(state.log.length, 40); }

const fx = [];

function buyPot(type) {
  const p = POTS[type];
  const idx = state.pots.findIndex(x => x === null);
  if (idx < 0) return toast('阳台放满了，先扩建一下吧。');
  if (state.gold < p.price) return toast('金币不够。');
  state.gold -= p.price;
  state.pots[idx] = { type, plant: null };
  state.target = idx;
  addLog(`买了一个${p.name}，摆在阳台第 ${idx + 1} 格。`);
  addFx(idx, 'spark');
  if (state.tab === 'pots') state.tab = 'flower';
  commit();
  toast(`${p.name}到手！现在去挑一株植物吧。`);
}
function emptyPotIndex() {
  const t = state.target;
  if (t >= 0 && state.pots[t] && !state.pots[t].plant) return t;
  return state.pots.findIndex(x => x && !x.plant);
}
function buyPlant(id) {
  const sp = SP[id];
  const idx = emptyPotIndex();
  if (idx < 0) return toast('没有空花盆了，先买一个花盆。');
  if (state.gold < sp.price) return toast('金币不够。');
  state.gold -= sp.price;
  state.pots[idx].plant = { sp: id, id: state.seq++, progress: 0, health: 100, water: 60, nutr: 50, soil: 70, done: {}, age: 0, matured: false, dead: false };
  state.target = -1;
  addLog(`把一株${sp.name}幼苗种进了${POTS[state.pots[idx].type].name}。`);
  addFx(idx, 'spark');
  commit();
  toast(`${sp.name}种好了。记得看水分条再浇水。`);
}
function act(i, kind) {
  const slot = state.pots[i]; if (!slot || !slot.plant) return;
  const pl = slot.plant, sp = SP[pl.sp];
  if (pl.dead || pl.done[kind]) return;
  if (kind === 'water') {
    pl.water = Math.min(130, pl.water + WATER_ADD);
    if (pl.water > 100) toast(`${sp.name}的盆土已经很湿了，水漫出来了……`);
  } else if (kind === 'fert') {
    if (state.gold < FERT_COST) return toast('买肥料的钱都不够了。');
    state.gold -= FERT_COST;
    pl.nutr = Math.min(130, pl.nutr + FERT_ADD);
    if (pl.nutr > 100) toast('肥料下得太猛了。');
  } else if (kind === 'soil') {
    pl.soil = Math.min(100, pl.soil + SOIL_ADD);
  }
  pl.done[kind] = true;
  addFx(i, kind);
  commit();
}
function sell(i) {
  const slot = state.pots[i]; if (!slot || !slot.plant || !slot.plant.matured || slot.plant.dead) return;
  const price = sellPrice(slot), sp = SP[slot.plant.sp];
  state.gold += price;
  addLog(`卖掉了养了 ${slot.plant.age} 天的${sp.name}，换来 ${price} 金币。`);
  slot.plant = null;
  addFx(i, 'coins');
  commit();
  toast(`${sp.name}卖了 ${price} 金币！花盆空出来了。`);
}
function clearPlant(i) {
  const slot = state.pots[i]; if (!slot || !slot.plant) return;
  addLog(`把枯掉的${SP[slot.plant.sp].name}铲掉了。`);
  slot.plant = null; commit();
}
function expandCost() { return 150 + (state.slots - 4) * 100; }
function expand() {
  if (state.slots >= 10) return;
  const c = expandCost();
  if (state.gold < c) return toast(`扩建需要 ${c} 金币。`);
  state.gold -= c; state.slots += 2; state.pots.push(null, null);
  addLog(`花 ${c} 金币扩建了阳台，现在能放 ${state.slots} 盆。`);
  commit();
}
function rollWeather(season) {
  const tbl = WX_TABLE[season];
  let r = Math.random() * tbl.reduce((a, b) => a + b[1], 0);
  for (const [w, p] of tbl) { if ((r -= p) <= 0) return w; }
  return tbl[0][0];
}
function rollTemp(season, w) {
  if (w === '高温') return 35 + Math.floor(Math.random() * 4);
  if (w === '霜冻') return -6 + Math.floor(Math.random() * 5);
  const [a, b] = TEMP[season];
  return a + Math.floor(Math.random() * (b - a + 1)) - (w === '雪' ? 4 : 0);
}

function nextDay() {
  const season = seasonOf(state.day);
  const hot = state.weather === '高温' ? 1.5 : 1;
  const notes = [];
  state.pots.forEach((slot) => {
    if (!slot || !slot.plant || slot.plant.dead) return;
    const pl = slot.plant, sp = SP[pl.sp], pot = POTS[slot.type], need = NEED[sp.need];
    const [lo, hi] = need.range;
    // judge the day with today's care
    const wq = pl.water > 100 ? 0.2 : pl.water < 10 ? 0 : (pl.water >= lo && pl.water <= hi) ? 1 : 0.55;
    const nq = pl.nutr > 100 ? 0.4 : pl.nutr >= 30 ? 1 : pl.nutr >= 12 ? 0.6 : 0.3;
    const sq = pl.soil >= 40 ? 1 : pl.soil >= 20 ? 0.7 : 0.4;
    const q = wq * 0.45 + nq * 0.3 + sq * 0.25;
    let dh = 0;
    if (pl.water > 100) dh -= 6 + (pl.water - 100) * 0.4;
    else if (pl.water < 10) dh -= 14;
    else if (sp.need === 'low' && pl.water > hi + 10) dh -= 5;
    else if (sp.need === 'high' && pl.water < lo - 15) dh -= 4;
    if (pl.nutr > 100) dh -= 10; else if (pl.nutr < 10) dh -= 4;
    if (pl.soil < 15) dh -= 3;
    if (dh === 0 && q >= 0.75) dh = 6;
    pl.health = clamp(pl.health + dh, 0, 100);
    if (pl.health <= 0) { pl.dead = true; notes.push(`${sp.name}没能撑过去，枯萎了。`); return; }
    if (!pl.matured) {
      const sf = sp.grow.includes(season) ? 1.15 : season === 3 ? 0.4 : 0.85;
      const g = q * sf * pot.grow * (0.5 + 0.5 * pl.health / 100) * 100 / sp.days;
      pl.progress = Math.min(100, pl.progress + g);
      if (pl.progress >= 100) {
        pl.matured = true;
        const first = !state.dex[sp.id];
        state.dex[sp.id] = true;
        notes.push(`${sp.name}长大了！${first ? '图鉴新解锁。' : ''}`);
      }
    }
    pl.age++;
    pl.water = Math.max(0, pl.water - 22 * need.mul * SEASON_DRY[season] * pot.dry * hot);
    pl.nutr = Math.max(0, pl.nutr - 8);
    pl.soil = Math.max(0, pl.soil - 9 * pot.compact);
    pl.done = {};
  });
  state.day++;
  const ns = seasonOf(state.day);
  if (ns !== season) { notes.unshift(SEASON_TIPS[ns]); if (ns === 0) notes.unshift(`新的一年，第 ${yearOf(state.day)} 年开始了。`); }
  state.weather = rollWeather(ns);
  state.temp = rollTemp(ns, state.weather);
  const living = state.pots.filter(s => s && s.plant && !s.plant.dead).map(s => s.plant);
  if (state.weather === '小雨' || state.weather === '雷阵雨') {
    const add = state.weather === '小雨' ? 28 : 38;
    living.forEach(pl => pl.water = Math.min(130, pl.water + add));
    if (living.length) notes.push(`${state.weather === '小雨' ? '下了场小雨' : '一场雷阵雨'}，盆土都喝饱了水，浇水前先看看。`);
  } else if (state.weather === '雪') {
    living.forEach(pl => pl.water = Math.min(130, pl.water + 8));
  } else if (state.weather === '霜冻') {
    const hurt = [];
    living.forEach(pl => { if (!SP[pl.sp].hardy) { pl.health = Math.max(1, pl.health - 10); hurt.push(SP[pl.sp].name); } });
    if (hurt.length) notes.push(`夜里打霜，${[...new Set(hurt)].join('、')}冻着了。`);
  } else if (state.weather === '高温' && living.length) {
    notes.push('今天高温，水干得特别快。');
  }
  notes.forEach(addLog);
  commit();
  const head = `${dayLabel(state.day)} · ${state.weather} ${state.temp}°C`;
  toast(notes.length ? `${head} — ${notes[0]}` : `${head} — 新的一天。`);
}

  pairs(c, pl, sp, S, v, sw, season, R) {

  },
  feather(c, pl, sp, S, v, sw, season, R, now) {
    const since = now - (pl.touched || -1e9);
    let f = since < 3500 ? 1 : since < 5500 ? 1 - (since - 3500) / 2000 : 0;

      const len = (22 + 58 * S) * (0.85 + R() * 0.2);
      const x1 = BX + Math.cos(a) * len + sw * len * 0.05, y1 = BY + Math.sin(a) * len;
      const cx = BX + Math.cos(a) * len * 0.3, cy = BY + Math.sin(a) * len * 0.65;
      curve(c, leafCol([20, 30, 38], v), 1.2, BX, BY, cx, cy, x1, y1);
      const fronds = 2 + Math.round(2 * S);

        const t = 0.35 + k * (0.6 / fronds), [x, y] = qpt(BX, BY, cx, cy, x1, y1, t), side = (k + i) % 2 ? 1 : -1;

        const ex = x + Math.cos(ra) * rl, ey = y + Math.sin(ra) * rl;

        for (let p = 1; p <= 8; p++) {

  },
  cloud(c, pl, sp, S, v, sw, season, R) {

    for (let i = 0; i < n; i++) {
      const off = n > 1 ? i / (n - 1) - 0.5 : 0, len = (24 + 64 * S) * (0.75 + R() * 0.3);

    const r0 = 5 + 11 * S;

    tips.forEach(([x, y]) => { for (let k = 0; k < 3; k++) blobs.push({ x: x + (R() - 0.5) * r0 * 1.4, y: y + (R() - 0.5) * r0 - r0 * 0.25, r: r0 * (0.6 + R() * 0.5), keep: R(), mix: R(), k }); });

function visOf(pl, sp) {
  const [lo] = NEED[sp.need].range;
  let y = (1 - pl.health / 100) * 0.8;
  if (pl.nutr < 15) y += 0.35;
  if (pl.water > 100) y += 0.25;
  let droop = pl.water < 15 ? 0.25 + (15 - pl.water) / 15 * 0.65 : pl.water < lo - 12 ? 0.15 : 0;
  if (pl.dead) { y = 1; droop = 1; }
  return { y: Math.min(1, y), droop, dead: pl.dead };
}

function drawPlant(c, pl, sp, season, now, wig = 0) {
  const S = 0.22 + 0.78 * clamp(pl.progress / 100, 0, 1);
  const v = visOf(pl, sp);
  const amp = reduce ? 0 : (v.dead ? 0.2 : 1);
  const sw = Math.sin(now / 900 + pl.id * 1.7) * amp + wig;
  const R = rng(pl.id * 9973 + 17);
  c.save();
  FORMS[sp.form](c, pl, sp, S, v, sw, season, R, now);
  c.restore();
}

function drawFx(c, list, now) {
  list.forEach(f => {
    const e = now - f.t0;
    if (f.type === 'water') {
      for (let k = 0; k < 12; k++) {
        const p = e / 900 - k * 0.05; if (p < 0 || p > 1) continue;
        const x = 64 + k * 6.5 + Math.sin(k) * 3, y = 30 + p * 128;
        c.fillStyle = `rgba(80,150,220,${0.85 * (1 - p * 0.4)})`;
        c.beginPath(); c.moveTo(x, y - 5); c.quadraticCurveTo(x + 3, y, x, y + 2); c.quadraticCurveTo(x - 3, y, x, y - 5); c.fill();
      }
    } else if (f.type === 'fert') {
      for (let k = 0; k < 16; k++) {
        const p = e / 800 - k * 0.03; if (p < 0 || p > 1) continue;
        c.fillStyle = k % 3 ? 'rgba(214,160,50,.95)' : 'rgba(255,240,180,.95)';
        dot(c, 70 + (k * 23) % 60, 50 + p * 108, 1.6);
      }
    } else if (f.type === 'soil') {
      for (let k = 0; k < 14; k++) {
        const p = e / 700; if (p > 1) continue;
        c.fillStyle = `rgba(110,75,45,${1 - p})`;
        dot(c, 58 + k * 6, BY - Math.sin(p * Math.PI) * (8 + (k % 4) * 4), 1.6);
      }
    } else if (f.type === 'spark' || f.type === 'coins') {
      const p = e / 1000; if (p > 1) return;
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * TAU, d = 20 + p * 46, x = 100 + Math.cos(a) * d, y = (f.type === 'coins' ? 120 - p * 60 : 110) + Math.sin(a) * d * 0.6;
        c.fillStyle = f.type === 'coins' ? `rgba(230,175,40,${1 - p})` : `rgba(255,210,90,${1 - p})`;
        if (f.type === 'coins') dot(c, x, y, 3); else { c.save(); c.translate(x, y); c.rotate(p * 3); c.fillRect(-1.5, -1.5, 3, 3); c.restore(); }
      }
    }
  });
}

function drawWeather(c, wx, now, seed) {
  if (reduce) return;
  if (wx === '小雨' || wx === '雷阵雨') {
    c.strokeStyle = 'rgba(110,150,200,.45)'; c.lineWidth = 0.9;
    const n = wx === '小雨' ? 12 : 20, sp = wx === '小雨' ? 0.14 : 0.22;
    for (let k = 0; k < n; k++) { const x = (k * 53 + seed * 31) % 210, y = ((now * sp) + k * 97 + seed * 13) % 240 - 20; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y + 10); c.stroke(); }
  } else if (wx === '雪') {
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (let k = 0; k < 16; k++) { const y = ((now * 0.025) + k * 61 + seed * 17) % 240 - 10, x = (k * 41 + seed * 7) % 200 + Math.sin(now / 1200 + k) * 6; dot(c, x, y, 1.6 + (k % 3) * 0.5); }
  }
}

/* ================= rendering ================= */
const canvases = [];
const wiggles = {};
function canvasFor(i) {
  if (!canvases[i]) {
    const cv = document.createElement('canvas');
    cv.setAttribute('role', 'img');
    cv.addEventListener('click', () => {
      const slot = state.pots[i];
      if (!slot || !slot.plant) return;
      if (slot.plant.sp === 'mimosa') slot.plant.touched = performance.now();
      else wiggles[i] = performance.now();
    });
    canvases[i] = cv;
  }
  return canvases[i];
}
function sizeCanvas(cv) {
  const w = cv.clientWidth; if (!w) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(w * dpr), H = Math.round(w * 1.1 * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
}

const ICON = {
  water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c3.5 4.4 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.5 7.4 12 3z" fill="var(--water)" fill-opacity=".25" stroke="var(--water)"/></svg>',
  fert: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M7 8h10l-1 12H8L7 8z" stroke="var(--nutr)" fill="var(--nutr)" fill-opacity=".2"/><path d="M9 8c0-2 1.3-4 3-4s3 2 3 4" stroke="var(--nutr)"/><circle cx="12" cy="14" r="1.6" fill="var(--nutr)"/></svg>',
  soil: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--soil)" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9"/><path d="M7 12h10v3a5 5 0 0 1-10 0v-3z" fill="var(--soil)" fill-opacity=".2"/><path d="M4 21h16"/></svg>',
};

function barHTML(cls, label, val, max, band, shown) {
  const pct = clamp(val / max * 100, 0, 100);
  const b = band ? `<span class="band" style="left:${band[0]}%;width:${band[1] - band[0]}%"></span>` : '';
  return `<div class="bar ${cls}"><span>${label}</span><div class="track"><i style="width:${pct}%"></i>${b}</div><b>${shown ?? Math.round(val)}</b></div>`;
}

function render() {
  const season = seasonOf(state.day);
  document.body.dataset.season = season;
  $('glyph').textContent = SEASONS[season];
  $('date').textContent = `第${yearOf(state.day)}年 · ${SEASONS[season]} · 第${state.day % DAYS_PER_SEASON + 1}天`;
  $('wx').textContent = `${state.weather} ${state.temp}°C`;
  $('gold').textContent = state.gold;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === state.speed)));
  $('daybar').hidden = state.speed === 0;
  $('next').textContent = state.speed === 0 ? '睡一觉 · 下一天' : '直接跳到明天';
  const used = state.pots.filter(Boolean).length;
  $('slotinfo').textContent = `${used} / ${state.slots} 格`;
  const ex = $('expand');
  if (state.slots >= 10) { ex.textContent = '阳台已经最大'; ex.disabled = true; }
  else { ex.textContent = `扩建 +2 格 · ${expandCost()} 金`; ex.disabled = state.gold < expandCost(); }

  // balcony
  const grid = $('grid');
  grid.replaceChildren();
  state.pots.forEach((slot, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    if (!slot) {
      card.classList.add('empty');
      card.innerHTML = `<div class="slot-body"><strong>空位</strong><span>这里可以摆一个花盆</span><button class="ghost" data-go="pots">去买花盆</button></div>`;
      grid.append(card); return;
    }
    if (i === emptyPotIndex() && !slot.plant) card.classList.add('target');
    const wrap = document.createElement('div'); wrap.className = 'cv-wrap';
    const cv = canvasFor(i); wrap.append(cv);
    const info = document.createElement('div'); info.className = 'info';
    if (!slot.plant) {
      cv.setAttribute('aria-label', `空的${POTS[slot.type].name}`);
      info.innerHTML = `<div class="name-row"><h3>空花盆</h3><span>${POTS[slot.type].name}</span></div>
        <p class="status">${POTS[slot.type].desc}</p>
        <button class="wide" data-plant="${i}">种点什么</button>`;
    } else {
      const pl = slot.plant, sp = SP[pl.sp], need = NEED[sp.need];
      const stage = stageName(pl, sp), [st, bad] = statusOf(pl, sp);
      cv.setAttribute('aria-label', `${sp.name}，${stage}`);
      const chip = document.createElement('span');
      chip.className = 'chip' + (pl.dead ? ' dead' : pl.matured ? ' ripe' : '');
      chip.textContent = stage; wrap.append(chip);
      const age = document.createElement('span'); age.className = 'age'; age.textContent = `第 ${pl.age + 1} 天`; wrap.append(age);
      const wBar = barHTML('water' + (pl.water > 100 ? ' over' : ''), '水分', pl.water, 100, need.range);
      const nBar = barHTML('nutr' + (pl.nutr > 100 ? ' over' : ''), '肥力', pl.nutr, 100);
      const sBar = barHTML('soil', '松软', pl.soil, 100);
      const hBar = barHTML('heart', '健康', pl.health, 100);
      const gBar = barHTML('grow', '成长', pl.progress, 100, null, Math.floor(pl.progress) + '%');
      let tail;
      if (pl.dead) tail = `<button class="wide soft" data-clear="${i}">铲掉枯株</button>`;
      else {
        const d = pl.done;
        tail = `<div class="acts">
          <button class="act${d.water ? ' done' : ''}" data-act="water" data-i="${i}" ${d.water ? 'disabled' : ''}>${ICON.water}${d.water ? '浇过了' : '浇水'}</button>
          <button class="act${d.fert ? ' done' : ''}" data-act="fert" data-i="${i}" ${d.fert || state.gold < FERT_COST ? 'disabled' : ''}>${ICON.fert}${d.fert ? '施过了' : '施肥'}<span class="cost">${d.fert ? '' : FERT_COST + ' 金'}</span></button>
          <button class="act${d.soil ? ' done' : ''}" data-act="soil" data-i="${i}" ${d.soil ? 'disabled' : ''}>${ICON.soil}${d.soil ? '松过了' : '松土'}</button>
        </div>` + (pl.matured ? `<button class="wide" data-sell="${i}">出售 · ${sellPrice(slot)} 金</button>` : '');
      }
      info.innerHTML = `<div class="name-row"><h3>${sp.name}</h3><span>${POTS[slot.type].name} · ${need.label}</span></div>
        <div class="bars">${wBar}${nBar}${sBar}${hBar}${gBar}</div>
        <p class="status${bad ? ' bad' : ''}">${st}</p>${tail}`;
    }
    card.append(wrap, info);
    grid.append(card);
  });
  requestAnimationFrame(() => canvases.forEach(cv => cv && cv.isConnected && sizeCanvas(cv)));

  // shop
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
  const dexN = Object.keys(state.dex).length;
  $('dexinfo').textContent = `图鉴 ${dexN} / ${PLANTS.length}`;
  renderShop();

  // log
  $('log').innerHTML = state.log.map(e => `<li><span>${yearOf(e.d) > 1 ? yearOf(e.d) + '年' : ''}${dayLabel(e.d)}</span><div>${e.t}</div></li>`).join('');
}

let shopKey = '';
function renderShop() {
  const freeSlot = state.pots.findIndex(x => x === null) >= 0;
  const potIdx = emptyPotIndex();
  const key = [state.tab, state.gold, freeSlot, potIdx, Object.keys(state.dex).join()].join('|');
  if (key === shopKey) return;
  shopKey = key;
  const items = $('items');
  items.replaceChildren();
  const hint = $('shophint');
  if (state.tab === 'pots') {
    hint.textContent = freeSlot ? '花盆会摆在阳台的第一个空位上。不同的盆有不同的脾气。' : '阳台放满了，扩建之后才能再买花盆。';
    Object.entries(POTS).forEach(([k, p]) => {
      const el = document.createElement('div'); el.className = 'item';
      const cv = document.createElement('canvas'); cv.width = 148; cv.height = 162;
      el.innerHTML = `<div class="tx"><div class="t1"><strong>${p.name}</strong></div><p>${p.desc}</p>
        <div class="t3"><button class="buy" data-buypot="${k}" ${!freeSlot || state.gold < p.price ? 'disabled' : ''}>${p.price} 金</button></div></div>`;
      el.prepend(cv); items.append(el);
      const c = cv.getContext('2d'); c.setTransform(148 / 200, 0, 0, 148 / 200, 0, -30); drawPot(c, k); drawSoil(c, { type: k }, null, '');
    });
    return;
  }
  hint.textContent = potIdx >= 0 ? `买下的幼苗会种进阳台第 ${potIdx + 1} 格的空花盆。` : '还没有空花盆，先去“花盆”那一栏买一个。';
  PLANTS.filter(p => p.cat === state.tab).forEach(sp => {
    const el = document.createElement('div'); el.className = 'item';
    const cv = document.createElement('canvas'); cv.width = 148; cv.height = 162;
    const got = state.dex[sp.id];
    el.innerHTML = `<div class="tx"><div class="t1"><strong>${sp.name}</strong><span class="tag">${NEED[sp.need].label}</span>${got ? '<span class="tag got">已养成</span>' : ''}</div>
      <p>${sp.note}</p>
      <div class="t3"><span>约 ${sp.days} 天长成 · 成株卖 ${sp.sell} 金起</span><button class="buy" data-buyplant="${sp.id}" ${potIdx < 0 || state.gold < sp.price ? 'disabled' : ''}>${sp.price} 金</button></div></div>`;
    el.prepend(cv); items.append(el);
    const season = sp.show ?? (sp.bloom ? sp.bloom[0] : sp.id === 'foxtail' ? 2 : 1);
    const demo = { sp: sp.id, id: PLANTS.indexOf(sp) + 3, progress: 100, health: 100, water: 60, nutr: 60, soil: 70, matured: true, dead: false };
    const c = cv.getContext('2d'); c.setTransform(148 / 200, 0, 0, 148 / 200, 0, 0);
    drawPot(c, 'clay'); drawSoil(c, { type: 'clay' }, demo, ''); drawPlant(c, demo, sp, season, 0);
  });
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1000, now - last); last = now;
  if (state.speed > 0) {
    state.clock += dt / SPEED_MS[state.speed];
    if (state.clock >= 1) { state.clock = 0; nextDay(); }
    $('dayfill').style.width = (state.clock * 100).toFixed(1) + '%';
    const hr = 6 + state.clock * 16, hh = Math.floor(hr), mm = Math.floor((hr - hh) * 6) * 10;
    $('hour').textContent = `${hh < 12 ? '上午' : hh < 18 ? '下午' : '晚上'} ${hh}:${String(mm).padStart(2, '0')}`;
  } else $('hour').textContent = '';
  const season = seasonOf(state.day);
  for (let i = 0; i < state.pots.length; i++) {
    const slot = state.pots[i], cv = canvases[i];
    if (!slot || !cv || !cv.isConnected || !cv.width) continue;
    const c = cv.getContext('2d'), k = cv.width / 200;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(k, 0, 0, k, 0, 0);
    drawWeather(c, state.weather, now, i + 1);
    drawPot(c, slot.type);
    drawSoil(c, slot, slot.plant, state.weather);
    if (slot.plant) {
      const we = now - (wiggles[i] || -1e9), wig = we < 1200 ? Math.sin(we / 70) * 3 * (1 - we / 1200) : 0;
      drawPlant(c, slot.plant, SP[slot.plant.sp], season, now, wig);
    }
    drawFx(c, fx.filter(f => f.i === i), now);
  }
  for (let j = fx.length - 1; j >= 0; j--) if (now - fx[j].t0 > 1400) fx.splice(j, 1);
  requestAnimationFrame(frame);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act) act(+b.dataset.i, b.dataset.act);
  else if (b.dataset.sell) sell(+b.dataset.sell);
  else if (b.dataset.clear) clearPlant(+b.dataset.clear);
  else if (b.dataset.buypot) buyPot(b.dataset.buypot);
  else if (b.dataset.buyplant) buyPlant(b.dataset.buyplant);
  else if (b.dataset.plant) { state.target = +b.dataset.plant; if (state.tab === 'pots') state.tab = 'flower'; render(); $('shop').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  else if (b.dataset.go) { state.tab = b.dataset.go; render(); $('shop').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  else if (b.dataset.tab) { state.tab = b.dataset.tab; render(); }
  else if (b.dataset.speed) { state.speed = +b.dataset.speed; save(); render(); }
});
$('next').addEventListener('click', () => { state.clock = 0; nextDay(); });
$('expand').addEventListener('click', expand);
let resetArmed = 0;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (Date.now() - resetArmed < 3000) { state = freshState(); canvases.length = 0; shopKey = ''; b.textContent = '重新开始'; resetArmed = 0; commit(); toast('阳台清空了，500 金币重新出发。'); return; }
  resetArmed = Date.now(); b.textContent = '再点一次确认清空';
  setTimeout(() => { if (Date.now() - resetArmed >= 3000) b.textContent = '重新开始'; }, 3100);
});
new ResizeObserver(() => canvases.forEach(cv => cv && cv.isConnected && sizeCanvas(cv))).observe($('grid'));

function start(data) {
  state = (data && typeof data.day === 'number') ? data : (load() || freshState());
  render();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
